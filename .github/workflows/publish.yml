name: Publish

# Controlled release: tag vX.Y.Z (must match package.json version) or
# workflow_dispatch on main with confirm=publish.
#
# Publishing uses npm Trusted Publisher (OIDC), no token.
# The package's trusted publisher on npmjs.com must match this workflow:
#   GitHub Actions, organization mindmuxai, repository brain.md,
#   workflow filename publish.yml, no environment.
# Requires npm >= 11.5.1 (installed below) and id-token: write.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish package.json version to npm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publisher (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm == 'publish' &&
       github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@mindmux"

      - name: Ensure modern npm
        run: |
          set -euo pipefail
          npm install -g npm@latest
          ver="$(npm --version)"
          echo "npm $ver"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is below 11.5.1, required for trusted publishing`);
              process.exit(1);
            }
          ' "$ver"

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing @mindmux/brain-md@$PKG (tag v$TAG)"

      # setup-node@v4 with registry-url writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and, when no token
      # is set, exports a placeholder NODE_AUTH_TOKEN. npm then treats token
      # auth as configured and skips the OIDC exchange. npm's trusted-publisher
      # example keeps registry-url; only the token line has to go. The scoped
      # registry line from scope: "@mindmux" stays.
      - name: Remove setup-node auth token line
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ ! -f "$npmrc" ]; then
            echo "expected setup-node npmrc at $npmrc"
            exit 1
          fi
          sed -i '/_authToken/d' "$npmrc"
          if grep -q '_authToken' "$npmrc"; then
            echo "failed to remove _authToken from $npmrc"
            exit 1
          fi
          echo "npm userconfig after removing _authToken:"
          cat "$npmrc"

      - name: Publish to npm
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance
